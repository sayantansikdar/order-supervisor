# Postgres + a Temporal dev server for local development.
# Start with:  docker compose up -d
# Temporal Web UI → http://localhost:8233
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: order_supervisor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/server:1.25.2
    command: ["temporal", "server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    ports:
      - "7233:7233"   # gRPC (SDK)
      - "8233:8233"   # Web UI
    volumes:
      - temporaldata:/data

volumes:
  pgdata:
  temporaldata:
